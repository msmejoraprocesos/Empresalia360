<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expertalia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Expertalia 360">
<meta name="description" content="Encuentra abogados, contadores, plomeros, electricistas y más cerca de ti.">
<style>
#instalar{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99999;display:none;align-items:center;gap:10px;
  background:#1F3A68;color:#fff;border-radius:999px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(18,26,43,.35);font:600 15px system-ui,-apple-system,sans-serif;max-width:calc(100% - 32px);box-sizing:border-box}
#instalar button{border:0;border-radius:999px;font:800 15px system-ui,sans-serif;cursor:pointer}
#instalar .si{background:#E3B04B;color:#121A2B;padding:9px 16px}
#instalar .no{background:transparent;color:#fff;font-size:20px;width:32px;height:32px;line-height:1}
#instalar .txt{line-height:1.25}
</style>
<script>
(function(){
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  if (standalone) return;
  function off(){ try { return localStorage.getItem('expertalia360.instalar') === 'no'; } catch(e) { return false; } }
  function show(text, btn, onYes){
    if (off() || document.getElementById('instalar')) return;
    var d = document.createElement('div'); d.id = 'instalar'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Instalar la app');
    d.innerHTML = '<span style="font-size:24px">📲</span><span class="txt">' + text + '</span>' + (btn ? '<button class="si">' + btn + '</button>' : '') + '<button class="no" aria-label="Cerrar">×</button>';
    document.body.appendChild(d); d.style.display = 'flex';
    d.querySelector('.no').onclick = function(){ d.remove(); try { localStorage.setItem('expertalia360.instalar','no'); } catch(e) {} };
    if (btn) d.querySelector('.si').onclick = function(){ d.remove(); onYes(); };
  }
  var prompt;
  addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); prompt = e;
    setTimeout(function(){ show('Ponla en tu pantalla de inicio', 'Instalar', function(){ prompt.prompt(); }); }, 4000);
  });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
  if (ios) setTimeout(function(){ show('Toca <b>Compartir</b> ⬆️ y luego <b>Agregar a inicio</b>', '', null); }, 5000);
})();
</script>
