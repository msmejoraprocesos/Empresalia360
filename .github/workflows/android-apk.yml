# Compila el APK de Android en Expo (EAS Build) desde GitHub, igual que en juicebar.
# Se lanza a mano: Actions → "Build Android (EAS)" → Run workflow.
# Al terminar, el build aparece en expo.dev → Expertalia 360 → Builds con el botón Install y el QR.
#
# Requisito (una vez): secret EXPO_TOKEN en Settings → Secrets and variables → Actions
# (se crea en expo.dev → Account settings → Access tokens).

name: Build Android (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de EAS (preview = APK para instalar)
        type: choice
        default: preview
        options: [preview, production]

concurrency:
  group: eas-build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: |
          npx tsc --noEmit
          npx eslint src

      - name: Compilar en EAS
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
